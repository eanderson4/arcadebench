<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="That ArcadeBench cabinet could not be found." />
    <title>Cabinet not found — ArcadeBench</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/arcade.css" />
  </head>
  <body class="error-page">
    <a class="skip-link" href="#not-found">Skip to message</a>
    <div class="arcade-glow arcade-glow--left" aria-hidden="true"></div>
    <div class="arcade-glow arcade-glow--right" aria-hidden="true"></div>
    <div class="page-shell">
      <header class="site-nav">
        <a class="wordmark" href="/">
          <span class="wordmark__mark" aria-hidden="true"></span>
          <span>ARCADEBENCH</span>
        </a>
        <p>ROUTE 404 <span aria-hidden="true">/</span> NO SIGNAL</p>
      </header>

      <main id="not-found" class="error-panel" tabindex="-1">
        <p class="kicker"><span aria-hidden="true"></span> CABINET NOT FOUND</p>
        <h1>This route is out of play.</h1>
        <p>The cabinet may have moved. Return to the arcade entrance or choose a game directly.</p>
        <nav class="error-actions" aria-label="Recovery links">
          <a class="error-action error-action--primary" href="/">RETURN TO ARCADE</a>
          <a class="error-action" href="/partition/">PARTITION</a>
          <a class="error-action" href="/maltline/">MALTLINE</a>
        </nav>
      </main>

      <footer class="site-footer">
        <p>DETERMINISTIC PLAY <span aria-hidden="true">/</span> INSPECTABLE RUNS</p>
        <nav aria-label="Site information">
          <a href="/privacy/">PRIVACY</a>
          <a href="/terms/">TERMS</a>
          <a href="https://github.com/eanderson4/arcadebench">SOURCE</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
