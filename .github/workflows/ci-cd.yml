name: Verify and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcadebench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan credentials and private details
        env:
          # Contributor identities are intentionally public metadata. The
          # stricter owner-identity check remains enabled by local pre-push.
          ARCADEBENCH_SKIP_IDENTITY_CHECK: "1"
        run: npm run security:prepush

      - name: Audit dependency advisories
        run: npm run security:audit

      - name: Build and test every workspace
        run: npm run check

      - name: Verify production migration subset and legacy API gate
        run: node scripts/prepare-production-migrations.mjs --check && node --test scripts/prepare-production-migrations.test.mjs && npm test --workspace=@arcadebench/platform -- --config vitest.production.config.ts

      - name: Assemble production site
        run: npm run build:site

      - name: Validate deployment bundle and boundaries offline
        run: npm run check:wrangler

      - name: Verify local Wrangler Worker and static-assets runtime
        run: npm run test:site:wrangler-local

      - name: Install pinned visual browser
        run: npx playwright install --with-deps chromium

      - name: Verify assembled site routing and launcher
        run: npm run test:site && npm run test:visual:site

      - name: Verify Maltline pixels and assembled route
        run: npm run test:visual --workspace=@arcadebench/maltline && npm run test:site:maltline

      - name: Upload verified site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arcadebench-site
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Deploy PR preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadebench-site
          path: dist/site

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked deployment dependencies
        run: npm ci

      # Uploads a version without changing the production deployment, routes,
      # cron triggers, or arcadebench.org traffic. Same-repository PRs receive a
      # stable alias; untrusted fork PRs never receive Cloudflare credentials.
      - name: Upload Cloudflare preview version
        id: preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            versions upload
            --preview-alias pr-${{ github.event.pull_request.number }}
            --keep-vars
            --message "PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

      - name: Publish preview link
        env:
          COMMAND_OUTPUT: ${{ steps.preview.outputs.command-output }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}-arcadebench
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const clean = (value) => value.replace(/\u001b\[[0-9;]*m/gu, '').replace(/[),.;]+$/u, '');
          const output = process.env.COMMAND_OUTPUT ?? '';
          const candidates = [...output.matchAll(/https:\/\/[^\s]+\.workers\.dev\/?/giu)]
            .map((match) => clean(match[0]));
          const previewUrl = candidates.find((url) => url.includes(`${process.env.PREVIEW_ALIAS}.`))
            ?? process.env.DEPLOYMENT_URL?.trim();
          if (!previewUrl) throw new Error('Wrangler uploaded the version but did not return its preview URL.');

          console.log(`Preview URL: ${previewUrl}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### ArcadeBench PR preview\n\n[Open the verified preview](${previewUrl})\n`);
          NODE

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check Cloudflare deployment configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped until the production secrets are configured."
          fi

      - name: Check out repository
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified site
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadebench-site
          path: dist/site

      - name: Set up Node.js
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked deployment dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm ci

      - name: Prepare reviewed production migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/prepare-production-migrations.mjs

      - name: Apply production D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply arcadebench-platform --remote

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
