name: Bug report
description: Report reproducible ArcadeBench behavior that looks wrong.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve the arcade. Do not include credentials,
        private replay data, or exploitable security details here; use the
        private vulnerability flow described in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Partition gameplay
        - Replay Lab
        - Model controller or benchmark runner
        - Leaderboard or platform SDK
        - Build, documentation, or CI
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the stage, seed, controls, or commands needed to reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and operating system, or Node.js version for CLI issues.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I reviewed this report and its attachments for credentials and private information.
          required: true
